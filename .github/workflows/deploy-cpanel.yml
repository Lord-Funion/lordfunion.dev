name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest code on cPanel
        env:
          SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y sshpass

          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.CPANEL_PORT }}" "${{ secrets.CPANEL_HOST }}" 2>/dev/null >> ~/.ssh/known_hosts

          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -p "${{ secrets.CPANEL_PORT }}" \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            'git -C /home/r5xegw92uu6o/public_html pull --ff-only origin main'
