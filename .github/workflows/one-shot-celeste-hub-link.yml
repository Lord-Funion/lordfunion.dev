name: One-shot CEleste hub link

on:
  push:
    paths:
      - '.github/workflows/one-shot-celeste-hub-link.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_celeste_hub_link.py
      - name: Commit terminal link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Route terminal CEleste link to project hub"
            git push
          fi
